<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="accountscript.js" defer></script>

</head>

<body>

    <nav class="navbar navbar-expand-sm bg-dark navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="forgedfitindex.html">
            <img src="images/forgedFitLogo.png" alt="Forged Fit Logo" style="width:50px;" class="rounded"> 
            </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                    <a class="nav-link" href="shop.html">Shop</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="basket.html">Basket</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="loginpage.html" id="accountLink">Login</a>
                    </li>
                </ul>
        </div>
    </nav>

    <main>

        <header>
            <h1>User Login | Registration</h1>
        </header>

        <div class="forgedCard">
        <h2>Register</h2> <br>
        <form 
        name="registerForm" 
        id="registerForm"
        method ="POST">
            Username: <input type="text" placeholder="Please enter a username." name="usernameRegister" id="usernameRegister"> <br>
            Password: <input type="password" placeholder="Please enter a password." name="passwordRegister" id="passwordRegister"> <br>
            Confirm Password: <input type="password" placeholder="Please confirm your password." name="passwordRegisterCheck" id="passwordRegisterCheck"> <br>
            Email: <input type="text" placeholder="Please enter your email address." name="emailRegister" id="emailRegister"> <br>
            
            <button type="submit" class="buttonLinks" id="registerButton">Submit</button>
            <input type="reset" id="clearButtonRegister" value="Clear">

            <p id="registerSuccess" class="d-none fw-bold"></p>
            </div>
        </form>

        <div class="forgedCard">

        <h2>Login</h2>

        <form
        name="loginForm"
        id="loginForm"
        method ="POST">
            Username: <input type="text" placeholder="Please enter a username." name="usernameLogin" id="usernameLogin"> <br>
            Password: <input type="password" placeholder="Please enter a password." name="passwordLogin" id="passwordLogin"> <br>
            
            <button type="submit" class="buttonLinks" id="loginButton">Login</button>
            <input type="reset" id="clearButtonLogin" value="Clear">

            <p id="loginSuccess" class="d-none fw-bold"></p>

            </div>
        </form>

    </main>

    <footer style="text-align: center; padding: 20px; background-color: var(--card); color: var(--text-muted);">

        <p>
           <a href="https://www.forgedfitgyms.co.uk/" target="_blank" rel="noopener noreferrer">
                ForgedFit Gyms
           </a>
           | 
           <a href="contact.html">
                Contact Us
           </a>
           | 
           <a href="terms.html">
                Terms and Conditions
           </a>
           | 
           <a href="privacy.html">
                Privacy Policy
           </a>
        </p>

    </footer>

</body>
</html>
