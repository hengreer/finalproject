<!DOCTYPE html>

<!-- https://www.w3schools.com/bootstrap5/bootstrap_navbar.php -->
    
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark sticky-top">

            <a class="navbar-brand" href="forgedfitindex.html">
                <img src="images/forgedFitLogo.png"
                    alt="Forged Fit Home"
                    style="width:50px;"
                    class="rounded">
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar"
                    aria-controls="collapsibleNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="shop.html">Shop</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="basket.html">Basket</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="loginpage.html" id="accountLink">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <header>
        <h1>ForgedFit Example Shop</h1>
    </header>

    <main>       
        <section class="hero">
            <div id="overlay">
                <h2 class="heroText">ForgedFit</h2>

                <p class="heroText">
                    Train stronger.
                    Feel Stronger.
                </p>
                <p>
                    <a href="shop.html" class="buttonLinks">
                        Shop Now
                    </a>
                </p>
            </div>
        </section>
       
    
        <section class="forgedCard">
            <h2>Featured Products</h2>
            <div class="row g-4">
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="productImageBox">
                        <img src="images/pinkTshirtDryWick.png" alt="Shortsleeve T-Shirt in Pink with Forged Fit Logo" class="img-fluid rounded productImage">

                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="productImageBox">
                        <img src="images/zipHoody.png" alt="Zip Hoodie in black with red trim with Forged Fit Logo" class="img-fluid rounded productImage">
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="productImageBox">
                        <img src="images/shaker.png" alt="Black Shaker Bottle with Forged Fit Logo" class="img-fluid rounded productImage">
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="productImageBox">
                        <img src="images/gymBag.png" alt="Gym Bag with Forged Fit Logo" class="img-fluid rounded productImage">
                    </div>
                </div>
            </div>

    <footer style="text-align: center; padding: 20px; background-color: var(--card); color: var(--text-muted);">

           <a href="terms.html">

           </a>
